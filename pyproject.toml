[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshcode"
version = "0.1.0"
description = "Coding agent que resuelve tareas con el mínimo de tokens y verifica en vivo lo que puede estar desactualizado."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
tavily = ["tavily-python"]

[project.scripts]
freshcode = "freshcode.cli:main"

[tool.setuptools.packages.find]
include = ["freshcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
